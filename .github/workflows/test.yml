name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QML test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qttest \
            qml6-module-qtquick-window \
            qml6-module-qtqml \
            qml6-module-qtqml-workerscript \
            libgl1 \
            libegl1
      - name: Test
        run: ./tests/run.sh
